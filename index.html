<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>For Haneen 🤍</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Cairo:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--pink:#f7c6d4;--rose:#e87fa0;--deep:#b84a6b;--cream:#fff8f3;--gold:#f0b44c;--ink:#5a3040;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#ffeef3,#fff8f3 40%,#fde7ef);color:var(--ink);font-family:Quicksand,Cairo,system-ui,sans-serif;overflow-x:hidden;min-height:100%}
#petals{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.petal{position:absolute;top:-40px;width:14px;height:22px;background:linear-gradient(160deg,#fff,var(--pink));border-radius:80% 0 80% 0;opacity:.8;animation:fall linear infinite}
@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(540deg)}}
section,footer{position:relative;z-index:1}
.hero{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.hero svg{width:min(70vw,300px);height:auto;filter:drop-shadow(0 12px 18px rgba(184,74,107,.25));animation:sway 5s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(3deg) translateY(-6px)}}
.pt{transform-origin:0 0;transform:rotate(var(--r)) scale(0);animation:bloom 1.4s cubic-bezier(.3,1.4,.5,1) forwards;animation-delay:var(--d)}
@keyframes bloom{to{transform:rotate(var(--r)) scale(1)}}
.st{opacity:0;animation:fadein 1s 1.6s forwards}
@keyframes fadein{to{opacity:1}}
h1{font-family:'Playfair Display',Georgia,serif;font-size:clamp(2.2rem,9vw,4.2rem);margin:.4em 0 .1em;color:var(--deep);opacity:0;animation:fadein 1.2s 1.2s forwards}
h1 em{color:var(--rose)}
.sub{font-size:1.1rem;opacity:0;animation:fadein 1.2s 1.8s forwards}
button{font:600 1.05rem Quicksand,sans-serif;border:0;border-radius:99px;padding:14px 30px;margin-top:26px;background:linear-gradient(135deg,var(--rose),var(--deep));color:#fff;cursor:pointer;box-shadow:0 8px 20px rgba(184,74,107,.35);opacity:0;animation:fadein 1s 2.4s forwards,pulse 2s 3.4s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.list{max-width:920px;margin:0 auto;padding:40px 18px 20px}
.list h2{font-family:'Playfair Display',serif;text-align:center;color:var(--deep);font-size:clamp(1.6rem,6vw,2.4rem);margin-bottom:6px}
.count{text-align:center;opacity:.7;margin-bottom:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.8);border:1px solid #fbd3df;border-radius:20px;padding:14px 16px;box-shadow:0 6px 16px rgba(232,127,160,.14);opacity:0;transform:translateY(30px) scale(.96);transition:opacity .7s,transform .7s cubic-bezier(.3,1.4,.5,1)}
.card.in{opacity:1;transform:none}
.card:hover{transform:translateY(-4px) rotate(-.6deg)}
.n{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),var(--rose));color:#fff;font-weight:600;font-size:.85rem}
.t{line-height:1.5;font-size:1.02rem;unicode-bidi:plaintext;text-align:start}
.card.big{background:linear-gradient(135deg,#fff,#ffe3ec);border-color:var(--rose)}
.card.big .t{color:var(--deep);font-weight:600}
.fin{min-height:80svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
.fin .big{font-family:'Playfair Display',serif;font-size:clamp(2.4rem,11vw,5rem);color:var(--deep);margin:0}
.fin p{max-width:420px;line-height:1.7}
.heart{position:fixed;z-index:5;pointer-events:none;font-size:22px;animation:up 1.6s ease-out forwards}
@keyframes up{to{transform:translateY(-160px) scale(1.6);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
<body>
<div id="petals"></div>

<section class="hero">
<svg viewBox="-110 -110 220 220" aria-label="A lily">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="0" y2="-1"><stop offset="0" stop-color="#ffd6e2"/><stop offset=".55" stop-color="#fff"/><stop offset="1" stop-color="#fbd0de"/></linearGradient>
</defs>
<g stroke="#e9a3b9" stroke-width="1.2">
<path class="pt" style="--r:30deg;--d:.1s" fill="url(#g)" d="M0 0C-18 -30 -16 -75 0 -100C16 -75 18 -30 0 0Z"/>
<path class="pt" style="--r:90deg;--d:.2s" fill="url(#g)" d="M0 0C-18 -30 -16 -75 0 -100C16 -75 18 -30 0 0Z"/>
<path class="pt" style="--r:150deg;--d:.3s" fill="url(#g)" d="M0 0C-18 -30 -16 -75 0 -100C16 -75 18 -30 0 0Z"/>
<path class="pt" style="--r:210deg;--d:.4s" fill="url(#g)" d="M0 0C-18 -30 -16 -75 0 -100C16 -75 18 -30 0 0Z"/>
<path class="pt" style="--r:270deg;--d:.5s" fill="url(#g)" d="M0 0C-18 -30 -16 -75 0 -100C16 -75 18 -30 0 0Z"/>
<path class="pt" style="--r:330deg;--d:.6s" fill="url(#g)" d="M0 0C-18 -30 -16 -75 0 -100C16 -75 18 -30 0 0Z"/>
<path class="pt" style="--r:0deg;--d:.7s" fill="url(#g)" d="M0 0C-22 -30 -20 -80 0 -108C20 -80 22 -30 0 0Z"/>
<path class="pt" style="--r:120deg;--d:.85s" fill="url(#g)" d="M0 0C-22 -30 -20 -80 0 -108C20 -80 22 -30 0 0Z"/>
<path class="pt" style="--r:240deg;--d:1s" fill="url(#g)" d="M0 0C-22 -30 -20 -80 0 -108C20 -80 22 -30 0 0Z"/>
</g>
<g class="st" stroke="#d98aa4" stroke-width="1.5" fill="var(--gold)">
<path d="M0 0L-26 -44M0 0L0 -52M0 0L26 -44" fill="none"/>
<circle cx="-26" cy="-46" r="4.5"/><circle cx="0" cy="-54" r="4.5"/><circle cx="26" cy="-46" r="4.5"/>
</g>
</svg>
<h1>For <em>Haneen</em> 🤍</h1>
<div class="sub">A little garden of everything I love about you</div>
<button id="go">Open your lilies 🌷</button>
</section>

<section class="list" id="list">
<h2>Things I Love About You</h2>
<div class="count" id="count"></div>
<div class="grid" id="grid"></div>
</section>

<footer class="fin">
<p class="big">I Love You</p>
<p>Every little thing, today and forever. You're my home, my safe place, my warmth, my princess.</p>
<button id="hug" style="opacity:1;animation:none">Tap for love 💗</button>
</footer>

<script>
var items=[
'I Love when you say "هش."','I Love when you say "يرخم"','I Love seeing you smile.','I Love your outfits.','I Love your Voice.','I Love your Sleepy voice.','I Love when you say "Byeeeee".','I Love when you match my weird vibes.','I Love Listening to your Laugh.','I Love seeing you embarrassed.','I Love you.','I Love when you say "I Love you".','I Love your chocolate cake.','I Love your بشاميل','I Love Listening to your day.','I Love when you run to me when smallest problem happen زي الصغار.','I Love your stickers.','I Love How you choose the suit one.','I Love you that you care about me.','I Love when you call me by my name.','I Love u.','I Love how fast you change ur mood.','I Like How you show me Love.','I love that you always want to know details, smallest about me.','The way your face lights up when you see me.','Your morning voice.','The way you Look at me (Full of love).','Spark in your eyes.','Your kindness to everyone.','Your Passion.','I Love you.','Your Cute face.','The text you send me.','When you say "Skaraa."','When you ask random question.','Your accessories (ring, watch...)','طريقة كلامك','The way you make me believe in myself.','I Love that you want to document every little moment we live.','When you say "دعيتلك".','I Love you.','When you say "mmmm".','When you buy me a gift.','When you take screenshots for video call.','Your funny faces 😅','لما بتحكي بحكاية بركز معاكي.','اهتمامك بيا','انك اختارتيني .','بتحبى نجاحاتي.','فخورة بيا.','I Love you.','I Love when you trust me.','When you say "تؤتؤ".','When you said "عايزة أكله".','Your Pure Soul','I Love you لما بتعاكسيني ❤️','إنـي مالي عينيـكي','شايفاني أحسن راجل','انك بتسامحيني','الدفا اللي بتدهولي','I Like that you are my home.','My Safe Place.','انك بتكوني مستريحة معايا.','انك ذكية / شاطرة.','That you do Ice Coffee.','بحب طموحك وشغفك.','قد ايه انت صادقة.','بحب براءتك زي الطفلة.','When u feel exciting.','That you see me a real man.','دايما حطاني ف الحسبة.','بحب نجاحك.','لو كله ضدي بتكوني معايا.','When you gave me Sun Screen.','Twinkies 🧁','Your music taste.','When you say "يلااااهووي!!".','القمورة بتاعتي.','حبك ليا مش مشروط .','I Love you.','I Become a child when I with u.','بحبك لما متشليش هم وتثقي فيا.','I Love How you heal me.','لما قلتيلي عينيك حلوة 😅','You are my princess.','Being me when I with you.','بتخافي عليا وبتكوني عايزة تحميني.','You are my warmth.','لما قلتيلي هعملك عصير وهضربك في الخلاط 🥤','I love when you send me a voice note.','When I miss you.','When I see your notification.','Your sense of humour.','Ur intelligence.','Being good listener.','I Love you forever ☺️','لما قلتيلي انت بتاعي خلاص.','لما الشمس بتيجي عليكي بتبقي قمر.','فرحتك بأي هدية بجيبها لك.','I Love you.'];
var grid=document.getElementById('grid');
document.getElementById('count').textContent=items.length+' little reasons, and I could never stop at 100 🌸';
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.2});
items.forEach(function(s,i){
var c=document.createElement('div');c.className='card'+(/^I Love you(\.| forever)/.test(s)?' big':'');
c.innerHTML='<div class="n">'+(i+1)+'</div><div class="t"></div>';
c.querySelector('.t').textContent=s;c.style.transitionDelay=(i%3)*90+'ms';
grid.appendChild(c);io.observe(c);
c.addEventListener('click',function(e){hearts(e.clientX,e.clientY,3)});
});
function hearts(x,y,n){for(var i=0;i<n;i++){var h=document.createElement('div');h.className='heart';h.textContent=['💗','🤍','🌸','💕'][Math.floor(Math.random()*4)];h.style.left=(x+Math.random()*50-25)+'px';h.style.top=y+'px';document.body.appendChild(h);setTimeout(function(el){el.remove()},1700,h)}}
document.getElementById('go').onclick=function(){document.getElementById('list').scrollIntoView({behavior:'smooth'})};
document.getElementById('hug').onclick=function(e){hearts(e.clientX,e.clientY,14)};
var p=document.getElementById('petals');
for(var i=0;i<22;i++){var d=document.createElement('div');d.className='petal';d.style.left=Math.random()*100+'%';d.style.setProperty('--x',(Math.random()*120-60)+'px');d.style.animationDuration=(9+Math.random()*9)+'s';d.style.animationDelay=(-Math.random()*14)+'s';d.style.transform='scale('+(.6+Math.random()*.9)+')';p.appendChild(d)}
</script>
</body>
</html>
